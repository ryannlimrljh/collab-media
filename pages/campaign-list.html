<style>
  /* Page-local. Composes tokens only — no new colors, radii, or spacing. */
  /* The divider sits tight under the page header, same as Home. */
  .c-shell .c-pageheader{margin-bottom:var(--spacing-24);}
  .cl-divider{border:none; border-top:1px solid var(--color-neutral-3);
    margin:0 0 var(--spacing-24);}
  .cl-controls{display:flex; flex-wrap:wrap; align-items:center;
    gap:var(--spacing-8); margin-bottom:var(--spacing-16);}
  /* Load entrance — the same arrival family as the planner's outline and
     the landing's tiles: controls first, then the rows cascade, then the
     pagination. The class leaves after the run so filtering and search
     never replay it. */
  @keyframes cl-arrive{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .cl-arriving .cl-controls{animation:cl-arrive 420ms var(--ease-settle) both; animation-delay:60ms;}
  .cl-arriving .c-table-standalone-wrap{animation:cl-arrive 420ms var(--ease-settle) both; animation-delay:120ms;}
  .cl-arriving .cl-pagination{animation:cl-arrive 420ms var(--ease-settle) both; animation-delay:560ms;}
  .cl-arriving tbody tr{animation:cl-arrive 380ms var(--ease-settle) both; animation-delay:540ms;}
  .cl-arriving tbody tr:nth-child(1){animation-delay:200ms;}
  .cl-arriving tbody tr:nth-child(2){animation-delay:240ms;}
  .cl-arriving tbody tr:nth-child(3){animation-delay:280ms;}
  .cl-arriving tbody tr:nth-child(4){animation-delay:320ms;}
  .cl-arriving tbody tr:nth-child(5){animation-delay:360ms;}
  .cl-arriving tbody tr:nth-child(6){animation-delay:400ms;}
  .cl-arriving tbody tr:nth-child(7){animation-delay:440ms;}
  .cl-arriving tbody tr:nth-child(8){animation-delay:480ms;}
  @media (prefers-reduced-motion:reduce){
    .cl-arriving .cl-controls, .cl-arriving .c-datatable,
    .cl-arriving .cl-pagination, .cl-arriving tbody tr{animation:none;}
  }
  .c-filter-tray{margin-bottom:var(--spacing-16);}
  /* Facets sit out on the bar, one labelled trigger each, the influence
     roster's move: what you can filter by is readable without opening
     anything, and each panel is the DS Compact filter unchanged. */
  .cl-pillbar{display:flex; flex-wrap:wrap; gap:var(--spacing-8);}
  .cl-pill{position:relative;}
  .cl-name{font-weight:700; color:var(--color-neutral-9);}
  .cl-sub{display:block; font-size:var(--text-caption-size);
    color:var(--color-neutral-5); font-weight:400; margin-top:2px;}
  .cl-updated{color:var(--color-neutral-5); white-space:nowrap;}
  .c-table-action-col{text-align:right;}
  /* Full-width flex so the kebab pins to the cell's right edge on
     every row, whatever width the Continue/View button takes. */
  .cl-actions{display:flex; width:100%; align-items:center; justify-content:flex-end; gap:6px;}
  .cl-more{position:relative; display:inline-flex;}
  .cl-more-btn{color:var(--color-neutral-5); width:32px; height:32px;}
  .cl-more:hover .cl-more-btn, .cl-more.is-open .cl-more-btn{color:var(--color-neutral-9); background:var(--color-neutral-2);}
  /* Fly-out opens to the LEFT so it never clips against the table's
     scroll container, top or bottom row alike. */
  .cl-menu{position:absolute; right:calc(100% + 4px); top:50%;
    transform:translateY(-50%) translateX(4px);
    background:var(--color-neutral-1); border:1px solid var(--color-neutral-3);
    border-radius:var(--radius-md); box-shadow:var(--shadow-3);
    padding:4px; white-space:nowrap; z-index:5;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity var(--duration-fast) var(--ease-standard),
      transform var(--duration-fast) var(--ease-standard), visibility 0s linear var(--duration-fast);}
  .cl-more:hover .cl-menu, .cl-more:focus-within .cl-menu, .cl-more.is-open .cl-menu{
    opacity:1; visibility:visible; pointer-events:auto;
    transform:translateY(-50%) translateX(0); transition-delay:0s;}
  .cl-menu-del{display:inline-flex; align-items:center; gap:6px;
    border:0; background:transparent; cursor:pointer; font:inherit;
    font-size:13px; color:var(--color-red);
    padding:6px 10px; border-radius:var(--radius-sm);}
  .cl-menu-del:hover{background:rgba(253,51,67,.08);}
  .cl-menu-del i{font-size:14px;}
  #clRows tr.is-leaving{opacity:0; transition:opacity .2s ease;}
  .cl-industry{white-space:nowrap;}
  .cl-pagination{margin-top:var(--spacing-16);}

  /* ── A-Z rail, the influence roster's own: small grey letters, the
     current one in ink, letters with nothing to jump to faded near out.
     Functional weight, whisper visual weight. The content gains a right
     gutter rather than the rail sitting over the action column. */
  .cl-rail{position:fixed; right:6px; top:50%; transform:translateY(-50%);
    width:24px; z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:7px;}
  .cl-rail-row{display:flex; align-items:center; justify-content:center;
    border:0; background:none; padding:0; cursor:pointer;
    font-family:inherit; line-height:1;}
  .cl-rail-letter{width:22px; text-align:center; font-size:12px;
    font-weight:600; color:var(--color-neutral-4);
    transition:color var(--duration-fast) var(--ease-standard),
      transform var(--duration-fast) var(--ease-settle);}
  .cl-rail-row:hover .cl-rail-letter{color:var(--color-neutral-9);
    transform:translateX(-2px) scale(1.15);}
  .cl-rail-row.is-active .cl-rail-letter{color:var(--color-neutral-9); font-weight:800;}
  .cl-rail-row.is-empty{cursor:default; pointer-events:none;}
  .cl-rail-row.is-empty .cl-rail-letter{color:var(--color-neutral-3);}
  .cl-rail-row:focus-visible{outline:2px solid var(--color-obsidian);
    outline-offset:1px; border-radius:var(--radius-sm);}
  .c-shell .c-shell-content{padding-right:calc(var(--page-gutter) + 22px);}
  /* 27 letters have to fit one screen, so the pitch is the constraint. */
  @media (max-height:760px){ .cl-rail{gap:4px;} .cl-rail-letter{font-size:11px;} }
  @media (max-height:620px){ .cl-rail{gap:2px;} .cl-rail-letter{font-size:10px;} }
  @media (max-width:760px){
    .cl-rail{display:none;}
    .c-shell .c-shell-content{padding-right:var(--page-gutter);}
  }
  /* Sortable headers. */
  th.c-table-sort-th[data-sort]{cursor:pointer; user-select:none; white-space:nowrap;}
  .cl-sorticon{font-size:var(--icon-micro); color:var(--color-neutral-4);
    vertical-align:middle;}
  .cl-sorticon.is-on{color:var(--color-neutral-9);}
  /* Descending flips the glyph, so the two states are not identical at a
     glance even though the icon family stays the same. */
  .cl-sorticon.is-desc{transform:scaleY(-1);}
  th[data-sort]:hover .cl-sorticon{color:var(--color-neutral-9);}
  th[data-sort]:focus-visible{outline:2px solid var(--color-obsidian); outline-offset:-2px;}
  @media (max-width:900px){
    .cl-hide-narrow{display:none;}
  }
  /* Advertiser mark per row. */
  .cl-cell{display:flex; align-items:center; gap:var(--spacing-12); min-width:0;}
  .cl-txt{display:flex; flex-direction:column; min-width:0;}
  .cl-logo{flex:none; width:28px; height:28px; display:flex; align-items:center;
    justify-content:center; background:var(--color-neutral-1);
    border:1px solid var(--color-neutral-3); border-radius:var(--radius-sm);}
  .cl-logo img{width:18px; height:18px; object-fit:contain;}
</style>

<script>
(function () {
  'use strict';

  /* ── Facets, read off the data rather than hardcoded, so a new
     industry or status shows up on its own. Each returns display-ready
     values, which is also what the applied list stores: no separate
     value/label mapping to keep in step. ── */
  function titleCase(s){ return String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1); }
  var FACETS = [
    {key:'status', label:'Status', of:function(c){ return c.status ? [titleCase(c.status)] : []; }},
    {key:'industry', label:'Industry', of:function(c){ return c.industry ? [c.industry] : []; }},
    {key:'source', label:'Drafted by', of:function(c){ return [c.ai ? 'AI drafted' : 'Built by you']; }}
  ];
  /* Selections apply the moment they are made, so there is no pending
     copy to reconcile: `applied` is the only filter state. */
  var applied = {};
  FACETS.forEach(function(f){ applied[f.key] = []; });
  var query = '';

  var rowsEl = document.getElementById('clRows');
  var emptyEl = document.getElementById('clEmpty');
  var countEl = document.getElementById('clCount');
  /* Facet values reach markup as attributes and labels, so escape before
     they get there rather than trusting the data. */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function matches(c){
    /* Across facets is AND, within a facet is OR: picking two industries
       widens, adding a status narrows. */
    for (var i = 0; i < FACETS.length; i++){
      var f = FACETS[i], want = applied[f.key];
      if (!want.length) continue;
      var have = f.of(c);
      var hit = want.some(function(v){ return have.indexOf(v) > -1; });
      if (!hit) return false;
    }
    if (query){
      var q = query.toLowerCase();
      if (c.name.toLowerCase().indexOf(q) < 0 && c.brand.toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  }

  /* ── Sorting. Default is campaign name ascending so the A-Z rail beside
     the table means something the moment the page opens; every other key
     falls back to name as the tie-break, so equal statuses or industries
     stay alphabetical rather than shuffling. ── */
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  var sortKey = 'name', sortDir = 1;
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function letterOf(name){
    var c = (name || '').trim().charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : '#';
  }
  /* "27 Aug 2026" is the stored shape and Date's parse of it is not
     guaranteed, so read the three parts instead of trusting the string. */
  function updatedAt(s){
    var m = /^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/.exec((s || '').trim());
    if (!m) return 0;
    var mi = MONTHS.indexOf(m[2].charAt(0).toUpperCase() + m[2].slice(1, 3).toLowerCase());
    return mi < 0 ? 0 : new Date(+m[3], mi, +m[1]).getTime();
  }
  function weeksOf(s){ var m = /(\d+)/.exec(s || ''); return m ? +m[1] : 0; }
  function sortRows(rows){
    return rows.slice().sort(function(a, b){
      var c = 0;
      if (sortKey === 'budget') c = (a.budget || 0) - (b.budget || 0);
      else if (sortKey === 'updated') c = updatedAt(a.updated) - updatedAt(b.updated);
      else if (sortKey === 'duration') c = weeksOf(a.duration) - weeksOf(b.duration);
      else if (sortKey === 'name') {
        var la = LETTERS.indexOf(letterOf(a.name)), lb = LETTERS.indexOf(letterOf(b.name));
        c = la !== lb ? la - lb : String(a.name).localeCompare(String(b.name));
      } else c = String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''));
      /* Name breaks every tie, so a re-sort is stable to the eye. */
      if (!c && sortKey !== 'name') return String(a.name).localeCompare(String(b.name));
      return c * sortDir;
    });
  }
  function toggleSort(key){
    if (sortKey === key) sortDir = -sortDir;
    /* Money, time and dates read newest/largest first on the way in;
       words read A-Z. */
    else { sortKey = key; sortDir = (key === 'budget' || key === 'updated' || key === 'duration') ? -1 : 1; }
    render();
  }
  function paintSortIcons(){
    document.querySelectorAll('th[data-sort]').forEach(function(th){
      var on = th.dataset.sort === sortKey;
      var i = th.querySelector('.cl-sorticon');
      /* Every column keeps the same up-and-down glyph, sorted or not, so
         the header row reads as one control rather than one odd cell out.
         The sorted column is told apart by ink and weight, and its
         direction by aria-sort, which is what a screen reader reads
         anyway. */
      i.className = 'ph ph-arrows-down-up cl-sorticon' +
        (on ? ' is-on' + (sortDir === 1 ? ' is-asc' : ' is-desc') : '');
      th.setAttribute('aria-sort', on ? (sortDir === 1 ? 'ascending' : 'descending') : 'none');
    });
  }

  function render(){
    var ALLPLANS = window.collabPlans ? collabPlans.merged(CAMPAIGNS) : CAMPAIGNS;
    var hits = sortRows(ALLPLANS.filter(matches));
    lastHits = hits;
    paintSortIcons();
    rowsEl.innerHTML = hits.map(function(c, i){
      var action = c.status === 'booked' ? 'View' : 'Continue';
      var href = c.href || 'planner.html';
      return '<tr class="is-interactive is-clickable" data-letter="' + letterOf(c.name) + '" data-href="' + href + '">' +
        '<td><span class="cl-cell">' +
          '<span class="cl-logo"><img alt="" /></span>' +
          '<span class="cl-txt"><span class="cl-name">' + c.name + '</span>' +
          '<span class="cl-sub">' + c.brand + (c.ai ? ' · AI drafted' : '') + '</span></span></span></td>' +
        '<td>' + campaignBadge(c) + '</td>' +
        '<td class="cl-industry cl-hide-narrow">' + c.industry + '</td>' +
        '<td class="num">' + rmFmt(c.budget) + '</td>' +
        '<td class="cl-hide-narrow">' + c.duration + '</td>' +
        '<td class="cl-updated cl-hide-narrow">' + c.updated + '</td>' +
        '<td class="c-table-action-col"><span class="cl-actions">' +
          '<a class="c-btn c-btn-secondary c-btn-sm" href="' + href + '" style="text-decoration:none">' + action + '</a>' +
          '<span class="cl-more">' +
            '<button class="c-btn c-btn-ghost c-btn-sm c-btn-icon cl-more-btn" type="button" aria-label="Row options" aria-haspopup="true"><i class="ph ph-dots-three-vertical"></i></button>' +
            '<span class="cl-menu"><button class="cl-menu-del" type="button" data-idx="' + i + '"><i class="ph ph-trash"></i> Delete plan</button></span>' +
          '</span>' +
        '</span></td>' +
      '</tr>';
    }).join('');

    if (window.collabBrand){
      var logoImgs = rowsEl.querySelectorAll('.cl-logo img');
      hits.forEach(function(c, i){
        if (!logoImgs[i]) return;
        var b = collabBrand.pick(/^[\u2013\u2014-]$/.test(c.brand || '') ? '' : c.brand, c.name);
        collabBrand.attach(logoImgs[i], b);
      });
    }

    var none = !hits.length;
    rowsEl.closest('table').style.display = none ? 'none' : '';
    emptyEl.hidden = !none;
    if (none){
      var what = query ? '\u201c' + query + '\u201d' : (applied.length ? 'this filter' : '');
      var whyLine = what
        ? 'No plans match ' + what + '. Clear the filter, or start a new plan from Home.'
        : 'You have no media plans left. Start a new plan from Home.';
      emptyEl.innerHTML = '<div class="c-empty"><i class="ph-fill ph-tray"></i>' +
        '<h4>Nothing here yet</h4>' +
        '<p>' + whyLine + '</p>' +
        '<a class="c-btn c-btn-primary c-btn-md" href="campaigns.html" style="text-decoration:none"><i class="ph ph-arrow-left"></i> Back to media planner</a></div>';
    }
    countEl.textContent = none ? 'Showing 0 of ' + ALLPLANS.length
      : 'Showing 1\u2013' + hits.length + ' of ' + hits.length;
    renderRail(hits);

    /* Applied pills + Clear all — never visually silent. Each chip names
       its facet as well as its value, since "Beauty" and "Booked" mean
       nothing on their own once three facets can contribute. */
    var chips = [];
    FACETS.forEach(function(f){
      applied[f.key].forEach(function(v){
        chips.push('<span class="c-chip c-chip-input">' + f.label + ': ' + esc(v) +
          '<button class="c-chip-remove" type="button" data-facet="' + f.key + '" data-remove="' + esc(v) +
          '" aria-label="Remove ' + esc(f.label + ' ' + v) + '"><i class="ph ph-x"></i></button></span>');
      });
    });
    var tray = document.getElementById('clTray');
    tray.hidden = !chips.length;
    tray.innerHTML = chips.join('');
    document.getElementById('clClearAll').hidden = !chips.length;
  }

  /* ── Panels — one DS Compact filter per facet. Every toggle applies
     immediately, so there is no Done button and no staged copy; the
     panel stays open while the table re-renders underneath. ── */
  var pillbar = document.getElementById('clPillbar');
  var openFacet = null;
  function facetByKey(k){
    return FACETS.filter(function(f){ return f.key === k; })[0];
  }
  /* Options and their counts come off the plans currently in the store,
     so an option that can return nothing is never offered. */
  function facetOptions(f){
    var all = window.collabPlans ? collabPlans.merged(CAMPAIGNS) : CAMPAIGNS;
    var counts = {};
    all.forEach(function(c){
      f.of(c).forEach(function(v){ counts[v] = (counts[v] || 0) + 1; });
    });
    return Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; })
      .map(function(v){ return {v: v, n: counts[v]}; });
  }
  function optionRows(f){
    return facetOptions(f).map(function(o){
      var on = applied[f.key].indexOf(o.v) > -1;
      return '<label class="c-filter-option" data-facet="' + f.key + '" data-v="' + esc(o.v) + '">' +
        '<span class="c-checkbox-box' + (on ? ' on' : '') + '">' + (on ? '<i class="ph ph-check"></i>' : '') + '</span>' +
        '<span class="label">' + esc(o.v) + ' <span style="color:var(--color-neutral-4)">' + o.n + '</span></span></label>';
    }).join('');
  }
  function renderPillbar(){
    openFacet = null;
    pillbar.innerHTML = FACETS.map(function(f){
      var n = applied[f.key].length;
      return '<div class="cl-pill" data-facet="' + f.key + '">' +
        '<button class="c-filter-trigger' + (n ? ' active' : '') + '" type="button" data-facet="' + f.key + '" aria-haspopup="true" aria-expanded="false">' +
          f.label + (n ? '<span class="count">' + n + '</span>' : '') +
          '<i class="ph ph-caret-down chev"></i></button>' +
        '<div class="c-filter-panel" data-panel="' + f.key + '">' +
          '<div data-options="' + f.key + '"></div>' +
          '<div class="c-filter-footer">' +
            '<button class="c-btn c-btn-ghost c-btn-sm" data-clear="' + f.key + '" type="button">Clear</button>' +
          '</div></div></div>';
    }).join('');
  }
  function closePanel(){
    openFacet = null;
    pillbar.querySelectorAll('.c-filter-panel.is-open').forEach(function(p){ p.classList.remove('is-open'); });
    pillbar.querySelectorAll('.c-filter-trigger.is-open').forEach(function(tr){
      tr.classList.remove('is-open');
      tr.setAttribute('aria-expanded', 'false');
    });
  }
  /* The count badge is patched in place: rebuilding the pillbar would
     tear down the panel the user is still picking in. */
  function updateTrigger(k){
    var trig = pillbar.querySelector('.c-filter-trigger[data-facet="' + k + '"]');
    if (!trig) return;
    var n = applied[k].length;
    trig.classList.toggle('active', !!n);
    trig.innerHTML = facetByKey(k).label +
      (n ? '<span class="count">' + n + '</span>' : '') +
      '<i class="ph ph-caret-down chev"></i>';
    trig.setAttribute('aria-expanded', openFacet === k ? 'true' : 'false');
    if (openFacet === k) trig.classList.add('is-open');
  }
  pillbar.addEventListener('click', function(e){
    e.stopPropagation();
    var trig = e.target.closest('.c-filter-trigger');
    if (trig){
      var k = trig.dataset.facet, was = openFacet === k;
      closePanel();
      if (!was){
        openFacet = k;
        pillbar.querySelector('[data-options="' + k + '"]').innerHTML = optionRows(facetByKey(k));
        pillbar.querySelector('[data-panel="' + k + '"]').classList.add('is-open');
        trig.classList.add('is-open');
        trig.setAttribute('aria-expanded', 'true');
      }
      return;
    }
    var opt = e.target.closest('.c-filter-option');
    if (opt){
      var ok = opt.dataset.facet, v = opt.dataset.v;
      var i = applied[ok].indexOf(v);
      if (i > -1) applied[ok].splice(i, 1); else applied[ok].push(v);
      pillbar.querySelector('[data-options="' + ok + '"]').innerHTML = optionRows(facetByKey(ok));
      updateTrigger(ok);
      render();
      return;
    }
    var clr = e.target.closest('[data-clear]');
    if (clr){
      var ck = clr.dataset.clear;
      applied[ck] = [];
      pillbar.querySelector('[data-options="' + ck + '"]').innerHTML = optionRows(facetByKey(ck));
      updateTrigger(ck);
      render();
    }
  });
  document.getElementById('clClearAll').addEventListener('click', function(){
    FACETS.forEach(function(f){ applied[f.key] = []; });
    renderPillbar(); render();
  });
  document.getElementById('clTray').addEventListener('click', function(e){
    var b = e.target.closest('[data-remove]');
    if (!b) return;
    var k = b.dataset.facet;
    applied[k] = applied[k].filter(function(v){ return v !== b.dataset.remove; });
    renderPillbar(); render();
  });
  document.addEventListener('click', function(e){
    if (openFacet === null) return;
    if (e.target.closest('#clPillbar')) return;
    closePanel();
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePanel(); });
  renderPillbar();

  var search = document.getElementById('clSearch');
  var clear = document.getElementById('clSearchClear');
  search.addEventListener('input', function(){
    query = search.value.trim();
    clear.hidden = !query;
    render();
  });
  clear.addEventListener('click', function(){
    search.value = ''; query = ''; clear.hidden = true; render(); search.focus();
  });

  /* Row options live behind the kebab: hovering (or clicking, for
     touch) reveals a fly-out with Delete. Choosing it removes the
     plan straight away; opening the menu is the deliberate step. */
  var lastHits = [];
  function closeMenus(){
    rowsEl.querySelectorAll('.cl-more.is-open').forEach(function(m){
      m.classList.remove('is-open');
    });
  }
  rowsEl.addEventListener('click', function(e){
    var kebab = e.target.closest('.cl-more-btn');
    if (kebab){
      e.stopPropagation();
      var wrap = kebab.parentNode;
      var open = wrap.classList.contains('is-open');
      closeMenus();
      if (!open) wrap.classList.add('is-open');
      return;
    }
    var del = e.target.closest('.cl-menu-del');
    if (del){
      e.stopPropagation();
      var rec = lastHits[Number(del.dataset.idx)];
      if (!rec) return;
      if (rec.saved && rec.id) collabPlans.remove(rec.id);
      else collabPlans.hideSeed(rec.name);
      var row = del.closest('tr');
      if (row) row.classList.add('is-leaving');
      setTimeout(render, 220);
      return;
    }
    if (e.target.closest('a')) return;
    var tr = e.target.closest('tr[data-href]');
    if (tr) window.location.href = tr.dataset.href;
  });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.cl-more')) closeMenus();
  });

  /* ── A-Z rail — letters only; the count rides the accessible label and
     the tooltip rather than taking any visual weight. Letters with no
     plan behind them are dimmed and taken out of the tab order, so the
     rail never offers a jump that goes nowhere. ── */
  var railEl = document.getElementById('clRail');
  var scroller = document.querySelector('.c-shell-content');
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderRail(hits){
    var counts = {};
    LETTERS.forEach(function(L){ counts[L] = 0; });
    hits.forEach(function(c){ counts[letterOf(c.name)] += 1; });
    railEl.innerHTML = LETTERS.map(function(L){
      var n = counts[L] || 0;
      var label = L === '#' ? 'symbols' : L;
      return '<button class="cl-rail-row' + (n ? '' : ' is-empty') + '" type="button" data-letter="' + L + '"' +
        (n ? ' title="' + n + '" aria-label="Jump to ' + label + ', ' + n +
             (n === 1 ? ' plan"' : ' plans"')
           : ' tabindex="-1" aria-hidden="true"') + '>' +
        '<span class="cl-rail-letter">' + L + '</span></button>';
    }).join('');
    spy();
  }

  /* A glide rather than a jump, and a chasing one: it re-measures the
     live distance each frame and closes a fraction of it, so it eases
     out and still lands true if the layout settles mid-flight. */
  var glideRAF = 0, glideStop = null;
  function cancelGlide(){
    if (glideRAF) { cancelAnimationFrame(glideRAF); glideRAF = 0; }
    if (glideStop) { clearTimeout(glideStop); glideStop = null; }
  }
  function glideTo(target, offset){
    cancelGlide();
    function deltaNow(){
      return target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - offset;
    }
    if (REDUCED) { scroller.scrollTop += deltaNow(); spy(); return; }
    var started = Date.now(), MAX_MS = 1100;
    function step(){
      var d = deltaNow();
      if (Math.abs(d) < 1 || Date.now() - started > MAX_MS) {
        scroller.scrollTop += d; cancelGlide(); spy(); return;
      }
      var stepPx = d * 0.16;
      if (Math.abs(stepPx) < 1) stepPx = d > 0 ? 1 : -1;
      scroller.scrollTop += stepPx;
      glideRAF = requestAnimationFrame(step);
    }
    glideRAF = requestAnimationFrame(step);
    /* rAF stalls when the tab is painted but not compositing, which
       would strand the glide; this lands it regardless. */
    glideStop = setTimeout(function(){
      if (glideRAF) { scroller.scrollTop += deltaNow(); cancelGlide(); spy(); }
    }, MAX_MS + 150);
    scroller.addEventListener('wheel', cancelGlide, {once: true, passive: true});
    scroller.addEventListener('touchstart', cancelGlide, {once: true, passive: true});
  }

  railEl.addEventListener('click', function(e){
    var row = e.target.closest('.cl-rail-row');
    if (!row || row.classList.contains('is-empty')) return;
    var target = rowsEl.querySelector('tr[data-letter="' + row.dataset.letter + '"]');
    if (target) glideTo(target, 56);
  });

  /* Scroll-spy — the letter whose first row owns the current top edge.
     The glide calls this itself on landing rather than waiting for a
     scroll event: a programmatic scrollTop does not always deliver one
     (a tab that is not compositing never fires it), which would leave
     the rail pointing at the letter you just jumped away from. */
  var spyTick = false;
  function spy(){
    var rows = rowsEl.querySelectorAll('tr[data-letter]');
    var topEdge = scroller.getBoundingClientRect().top + 90;
    var current = null;
    rows.forEach(function(r){
      if (r.getBoundingClientRect().top <= topEdge) current = r.dataset.letter;
    });
    if (!current && rows.length) current = rows[0].dataset.letter;
    railEl.querySelectorAll('.cl-rail-row').forEach(function(r){
      r.classList.toggle('is-active', r.dataset.letter === current);
    });
  }
  scroller.addEventListener('scroll', function(){
    if (spyTick) return;
    spyTick = true;
    setTimeout(function(){ spyTick = false; spy(); }, 80);
  }, {passive: true});

  /* Header sorting, pointer and keyboard. The th is role="button", so
     Enter and Space both have to act like one. */
  var theadEl = document.querySelector('thead');
  theadEl.addEventListener('click', function(e){
    var th = e.target.closest('th[data-sort]');
    if (th) toggleSort(th.dataset.sort);
  });
  theadEl.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var th = e.target.closest('th[data-sort]');
    if (!th) return;
    e.preventDefault();
    toggleSort(th.dataset.sort);
  });

  render();

  /* The arrival ran once with the first render; drop the class so
     later renders (filter, search) paint without replaying it. */
  setTimeout(function(){
    document.getElementById('clContent').classList.remove('cl-arriving');
  }, 1000);
})();
</script>
</body>
</html>
